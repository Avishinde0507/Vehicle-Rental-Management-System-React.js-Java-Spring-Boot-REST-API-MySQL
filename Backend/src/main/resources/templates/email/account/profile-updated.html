<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{email/common/styles :: emailStyles}"></th:block>
</head>
<body style="background-color: #F8FAFC; margin: 0; padding: 20px 0;">

  <!-- Main Container -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" align="center">
    <tr>
      <td align="center">
        <!-- 600px Max Width Outer Table -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" class="email-container" style="background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; overflow: hidden;">
          
          <!-- Header Fragment -->
          <tr>
            <td>
              <th:block th:replace="~{email/common/header :: emailHeader('Profile Updated Successfully', 'DriveX Account Information Modification')}"></th:block>
            </td>
          </tr>

          <!-- Main Content Card -->
          <tr>
            <td style="padding: 36px 32px;" class="content-padding">
              
              <!-- Status Badge -->
              <div align="center" style="margin-bottom: 20px;">
                <th:block th:replace="~{email/common/layout :: statusBadge('PROFILE UPDATED', 'VERIFIED')}"></th:block>
              </div>

              <!-- Greeting Section -->
              <h2 style="margin: 0 0 14px 0; color: #0F172A; font-size: 20px; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;">
                Hello <span th:text="${customerName != null ? customerName : 'Valued Customer'}">Valued Customer</span>,
              </h2>

              <p style="margin: 0 0 20px 0; color: #475569; font-size: 15px; line-height: 1.6; font-family: 'Segoe UI', Arial, sans-serif;">
                This email confirms that your personal profile details in DriveX VRMS were updated successfully.
              </p>

              <!-- Updated Details Summary Table -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; margin: 20px 0;">
                <tr>
                  <td style="padding: 20px;">
                    <h4 style="margin: 0 0 12px 0; color: #1E293B; font-size: 14px; font-weight: 700; text-transform: uppercase; font-family: 'Segoe UI', Arial, sans-serif;">Account Summary:</h4>
                    
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td style="padding: 6px 0; font-size: 13px; color: #64748B; font-family: 'Segoe UI', Arial, sans-serif;">Full Name:</td>
                        <td align="right" style="padding: 6px 0; font-size: 14px; color: #0F172A; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;" th:text="${customerName != null ? customerName : 'John Doe'}">John Doe</td>
                      </tr>
                      <tr>
                        <td style="padding: 6px 0; font-size: 13px; color: #64748B; font-family: 'Segoe UI', Arial, sans-serif;">Email Address:</td>
                        <td align="right" style="padding: 6px 0; font-size: 14px; color: #0F172A; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;" th:text="${customerEmail != null ? customerEmail : 'customer@example.com'}">customer@example.com</td>
                      </tr>
                      <tr>
                        <td style="padding: 6px 0; font-size: 13px; color: #64748B; font-family: 'Segoe UI', Arial, sans-serif;">Update Date & Time:</td>
                        <td align="right" style="padding: 6px 0; font-size: 14px; color: #0F172A; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;" th:text="${profileUpdatedDate != null ? profileUpdatedDate : 'July 30, 2026'}">July 30, 2026</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Call To Action Button -->
              <div align="center">
                <th:block th:replace="~{email/common/button :: secondaryButton(${profileUrl != null ? profileUrl : 'http://localhost:3000/profile'}, 'View Profile Details')}"></th:block>
              </div>

              <!-- Security Notice -->
              <th:block th:replace="~{email/common/layout :: securityNotice('If you did not make these changes to your profile, please review your account activity or reset your password immediately.')}"></th:block>

            </td>
          </tr>

          <!-- Footer Fragment -->
          <tr>
            <td>
              <th:block th:replace="~{email/common/footer :: emailFooter}"></th:block>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
