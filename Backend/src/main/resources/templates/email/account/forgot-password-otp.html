<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{email/common/styles :: emailStyles}"></th:block>
</head>
<body style="background-color: #F8FAFC; margin: 0; padding: 20px 0;">

  <!-- Main Container -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" align="center">
    <tr>
      <td align="center">
        <!-- 600px Max Width Outer Table -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" class="email-container" style="background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; overflow: hidden;">
          
          <!-- Header Fragment -->
          <tr>
            <td>
              <th:block th:replace="~{email/common/header :: emailHeader('Reset Your Password', 'Password Recovery & Security Request')}"></th:block>
            </td>
          </tr>

          <!-- Main Content Card -->
          <tr>
            <td style="padding: 36px 32px;" class="content-padding">
              
              <!-- Status Badge -->
              <div align="center" style="margin-bottom: 20px;">
                <th:block th:replace="~{email/common/layout :: statusBadge('PASSWORD RESET REQUEST', 'PENDING')}"></th:block>
              </div>

              <!-- Greeting Section -->
              <h2 style="margin: 0 0 14px 0; color: #0F172A; font-size: 20px; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; text-align: center;">
                Hello <span th:text="${userName != null ? userName : (customerName != null ? customerName : 'Valued Customer')}">Valued Customer</span>,
              </h2>

              <p style="margin: 0 0 24px 0; color: #475569; font-size: 15px; line-height: 1.6; font-family: 'Segoe UI', Arial, sans-serif; text-align: center;">
                We received a request to reset the password for your DriveX VRMS account. Use the verification OTP code below to set up a new password.
              </p>

              <!-- OTP Code Display Card -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 24px 0;">
                <tr>
                  <td align="center" style="background-color: #FEF2F2; border: 2px dashed #EF4444; border-radius: 12px; padding: 24px 16px;">
                    <span style="font-size: 12px; font-weight: 700; color: #991B1B; text-transform: uppercase; letter-spacing: 2px; font-family: 'Segoe UI', Arial, sans-serif; display: block; margin-bottom: 8px;">Password Reset OTP</span>
                    <span class="otp-code" th:text="${otp != null ? otp : '654321'}" style="font-size: 36px; font-weight: 900; color: #DC2626; letter-spacing: 8px; font-family: 'Courier New', Consolas, monospace; display: block;">654321</span>
                    <span style="font-size: 13px; color: #7F1D1D; font-family: 'Segoe UI', Arial, sans-serif; display: block; margin-top: 10px;">
                      &#9200; Expires in <strong style="color: #991B1B;">10 Minutes</strong>
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Call To Action Button -->
              <div align="center">
                <th:block th:replace="~{email/common/button :: dangerButton(${resetUrl != null ? resetUrl : 'http://localhost:3000/reset-password'}, 'Reset Account Password')}"></th:block>
              </div>

              <!-- Security Warning Notice Fragment -->
              <th:block th:replace="~{email/common/layout :: securityNotice('If you did NOT request a password reset, your account is still secure. However, we recommend logging in to verify your profile settings.')}"></th:block>

            </td>
          </tr>

          <!-- Footer Fragment -->
          <tr>
            <td>
              <th:block th:replace="~{email/common/footer :: emailFooter}"></th:block>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
