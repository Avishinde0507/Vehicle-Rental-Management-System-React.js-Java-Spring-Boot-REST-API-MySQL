<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- DriveX Professional Email Footer Fragment -->
  <div th:fragment="emailFooter">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
      <tr>
        <td bgcolor="#F1F5F9" style="padding: 28px 24px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; border-top: 1px solid #E2E8F0; text-align: center;">
          <!-- Support Box -->
          <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 20px;">
            <tr>
              <td align="center">
                <span style="display: inline-block; background-color: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 20px; padding: 6px 16px; font-size: 13px; color: #1E40AF; font-weight: 600; font-family: 'Segoe UI', Arial, sans-serif;">
                  Need Help? Email us at <a th:href="'mailto:' + ${supportEmail != null ? supportEmail : 'support@drivex.com'}" th:text="${supportEmail != null ? supportEmail : 'support@drivex.com'}" style="color: #2563EB; font-weight: 700; text-decoration: underline;">support@drivex.com</a>
                </span>
              </td>
            </tr>
          </table>

          <!-- Security & Automated Disclaimer -->
          <p style="margin: 0 0 10px 0; color: #64748B; font-size: 12px; line-height: 1.5; font-family: 'Segoe UI', Arial, sans-serif;">
            This is an automated operational notification regarding your DriveX VRMS account.<br>
            Please do not reply directly to this email. For assistance, contact customer support.
          </p>

          <!-- Divider -->
          <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 16px 0;">
            <tr>
              <td style="border-top: 1px solid #CBD5E1;"></td>
            </tr>
          </table>

          <!-- Copyright & Legal -->
          <p style="margin: 0; color: #94A3B8; font-size: 12px; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 500;">
            &copy; <span th:text="${currentYear != null ? currentYear : '2026'}">2026</span> <strong style="color: #475569;" th:text="${companyName != null ? companyName : 'DriveX VRMS'}">DriveX VRMS</strong>. All Rights Reserved.
          </p>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
