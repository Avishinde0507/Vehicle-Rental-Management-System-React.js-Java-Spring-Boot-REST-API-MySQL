<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- Reusable Status Badge Component -->
  <div th:fragment="statusBadge(statusText, badgeType)">
    <!-- Pending Badge -->
    <span th:if="${badgeType == 'PENDING'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #B45309; background-color: #FEF3C7; border: 1px solid #FDE68A; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#9203; <span th:text="${statusText}">PENDING</span>
    </span>

    <!-- Approved / Confirmed Badge -->
    <span th:if="${badgeType == 'APPROVED' or badgeType == 'CONFIRMED' or badgeType == 'SUCCESS'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #15803D; background-color: #DCFCE7; border: 1px solid #BBF7D0; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#10004; <span th:text="${statusText}">APPROVED</span>
    </span>

    <!-- Rejected / Failed Badge -->
    <span th:if="${badgeType == 'REJECTED' or badgeType == 'FAILED'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #B91C1C; background-color: #FEE2E2; border: 1px solid #FCA5A5; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#10008; <span th:text="${statusText}">REJECTED</span>
    </span>

    <!-- Completed Badge -->
    <span th:if="${badgeType == 'COMPLETED'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #1E40AF; background-color: #DBEAFE; border: 1px solid #BFDBFE; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#9733; <span th:text="${statusText}">COMPLETED</span>
    </span>

    <!-- Cancelled Badge -->
    <span th:if="${badgeType == 'CANCELLED'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #4B5563; background-color: #F3F4F6; border: 1px solid #E5E7EB; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#8899; <span th:text="${statusText}">CANCELLED</span>
    </span>

    <!-- Refund Badge -->
    <span th:if="${badgeType == 'REFUND'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #7E22CE; background-color: #F3E8FF; border: 1px solid #E9D5FF; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#8617; <span th:text="${statusText}">REFUND</span>
    </span>

    <!-- Verified Badge -->
    <span th:if="${badgeType == 'VERIFIED'}" style="display: inline-block; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #0369A1; background-color: #E0F2FE; border: 1px solid #BAE6FD; border-radius: 20px; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">
      &#10003; <span th:text="${statusText}">VERIFIED</span>
    </span>
  </div>

  <!-- Reusable Info Card Component -->
  <div th:fragment="infoCard(cardTitle, contentHtml)">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; margin: 16px 0;">
      <tr>
        <td style="padding: 16px 20px;">
          <h4 th:if="${cardTitle != null}" th:text="${cardTitle}" style="margin: 0 0 10px 0; color: #334155; font-size: 14px; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.5px;">Information Header</h4>
          <div th:utext="${contentHtml}" style="font-size: 14px; color: #475569; line-height: 1.6; font-family: 'Segoe UI', Arial, sans-serif;">
            Card content details go here.
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- Security Notice Card Fragment -->
  <div th:fragment="securityNotice(noticeText)">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #FFFBEB; border-left: 4px solid #F59E0B; border-radius: 6px; margin: 20px 0;">
      <tr>
        <td style="padding: 14px 18px;">
          <table border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td width="28" valign="top" style="font-size: 18px;">&#128274;</td>
              <td style="font-size: 13px; color: #92400E; line-height: 1.5; font-family: 'Segoe UI', Arial, sans-serif;">
                <strong style="color: #78350F;">Security Notice:</strong>
                <span th:text="${noticeText}">Never share your password, OTP, or verification code with anyone. DriveX support will never ask for your private security credentials.</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>

</body>
</html>
