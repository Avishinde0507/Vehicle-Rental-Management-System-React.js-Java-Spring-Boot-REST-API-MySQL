<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{email/common/styles :: emailStyles}"></th:block>
</head>
<body style="background-color: #F8FAFC; margin: 0; padding: 20px 0;">

  <!-- Main Container -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" align="center">
    <tr>
      <td align="center">
        <!-- 600px Max Width Outer Table -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" class="email-container" style="background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; overflow: hidden;">
          
          <!-- Header Fragment -->
          <tr>
            <td>
              <th:block th:replace="~{email/common/header :: emailHeader('Payment Received!', 'Official DriveX Transaction Receipt')}"></th:block>
            </td>
          </tr>

          <!-- Main Content Card -->
          <tr>
            <td style="padding: 36px 32px;" class="content-padding">
              
              <!-- Status Badge -->
              <div align="center" style="margin-bottom: 20px;">
                <th:block th:replace="~{email/common/layout :: statusBadge('PAYMENT SUCCESSFUL', 'SUCCESS')}"></th:block>
              </div>

              <!-- Greeting Section -->
              <h2 style="margin: 0 0 14px 0; color: #0F172A; font-size: 20px; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;">
                Hello <span th:text="${customerName != null ? customerName : 'Valued Customer'}">Valued Customer</span>,
              </h2>

              <p style="margin: 0 0 20px 0; color: #475569; font-size: 15px; line-height: 1.6; font-family: 'Segoe UI', Arial, sans-serif;">
                We have successfully processed your payment for DriveX vehicle rental services. Thank you for your payment!
              </p>

              <!-- Payment Breakdown Card -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; margin: 24px 0;">
                <tr>
                  <td style="padding: 20px;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td style="padding: 8px 0; font-size: 13px; color: #64748B; font-family: 'Segoe UI', Arial, sans-serif;">Transaction ID:</td>
                        <td align="right" style="padding: 8px 0; font-size: 14px; color: #0F172A; font-weight: 700; font-family: 'Courier New', Consolas, monospace;" th:text="${transactionId != null ? transactionId : 'TXN_9981203891'}">TXN_9981203891</td>
                      </tr>
                      <tr>
                        <td style="padding: 8px 0; font-size: 13px; color: #64748B; font-family: 'Segoe UI', Arial, sans-serif;">Booking Reference:</td>
                        <td align="right" style="padding: 8px 0; font-size: 14px; color: #2563EB; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;" th:text="${bookingId != null ? bookingId : 'BK-100293'}">BK-100293</td>
                      </tr>
                      <tr>
                        <td style="padding: 8px 0; font-size: 13px; color: #64748B; font-family: 'Segoe UI', Arial, sans-serif;">Payment Method:</td>
                        <td align="right" style="padding: 8px 0; font-size: 14px; color: #0F172A; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;" th:text="${paymentMethod != null ? paymentMethod : 'Razorpay / Credit Card'}">Razorpay Online</td>
                      </tr>
                      <tr style="border-top: 1px solid #E2E8F0;">
                        <td style="padding: 12px 0 0 0; font-size: 14px; color: #0F172A; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif;">Total Amount Paid:</td>
                        <td align="right" style="padding: 12px 0 0 0; font-size: 20px; color: #166534; font-weight: 900; font-family: 'Segoe UI', Arial, sans-serif;" th:text="${bookingAmount != null ? '&#8377;' + bookingAmount : '&#8377;8,500.00'}">&#8377;8,500.00</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Call To Action Button -->
              <div align="center">
                <th:block th:replace="~{email/common/button :: primaryButton(${invoiceUrl != null ? invoiceUrl : 'http://localhost:3000/invoices'}, 'View & Download Invoice')}"></th:block>
              </div>

            </td>
          </tr>

          <!-- Footer Fragment -->
          <tr>
            <td>
              <th:block th:replace="~{email/common/footer :: emailFooter}"></th:block>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
